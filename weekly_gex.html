<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly GEX</title>
<!--
  The week's 0-4DTE gamma map for SPY / QQQ / IWM. Served beside
  flow_viewer.html; reads live/weekly_gex/latest.json, which live_state writes
  (see WEEKLY GEX in live_state.py for how and when snapshots are taken).

  ONE COLUMN PER TRADING DAY, EACH COLUMN IS THAT DAY'S EXPIRY.
  Every morning at the first GEX pass after 09:31 ET the bot snapshots every
  remaining expiry of the week. A column shows the latest snapshot taken on or
  before its own expiry morning, so elapsed days freeze and stay put; the
  price line walks across them. A new week starts clean. ?week=YYYY-MM-DD
  opens an archived week.

  "As of" replays the page as it stood on that morning: expiries still ahead
  use that morning's snapshot, the price line stops at that day's close.
  Walls and peak are DERIVED per expiry from its own strikes -- UW's
  gex-levels are all-expiry, so they are not the same numbers as the main
  chart's dashed walls.
-->
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e;
    --up:#3fb950; --dn:#f85149; --call:#58a6ff; --put:#d29922; --accent:#a371f7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  #app{display:flex;flex-direction:column;height:100vh}
  #bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;
    border-bottom:1px solid var(--line);background:var(--panel)}
  #bar h1{font-size:13px;margin:0 8px 0 0;letter-spacing:.08em;text-transform:uppercase;
    color:var(--dim)}
  #bar a{color:var(--accent);text-decoration:none}
  button,select{background:#0d1117;color:var(--fg);border:1px solid var(--line);
    border-radius:6px;padding:4px 9px;font:inherit;cursor:pointer}
  button.on{border-color:var(--accent);background:#241b33}
  #info{margin-left:auto;color:var(--dim);font-size:11px}
  #legend{display:flex;flex-wrap:wrap;gap:14px;padding:5px 12px;font-size:11px;
    color:var(--dim);border-bottom:1px solid var(--line)}
  #legend i{display:inline-block;width:14px;height:8px;margin-right:5px;vertical-align:middle}
  #wrap{position:relative;flex:1;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #tip{position:absolute;pointer-events:none;background:#0b0f14ee;border:1px solid var(--line);
    border-radius:6px;padding:6px 8px;font-size:11px;white-space:pre;display:none;z-index:5}
  #empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    color:var(--dim);text-align:center;padding:16px}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <h1>Weekly GEX</h1>
    <span id="tks"></span>
    <label>view <select id="asof"></select></label>
    <label>scale <select id="scale">
      <option value="day">per day</option><option value="week">whole week</option></select></label>
    <label title="add the index's gamma (SPX on SPY, NDX on QQQ, RUT on IWM), mapped to the ETF's price by that morning's ratio">γ <select id="gx">
      <option value="">ETF only</option><option value="1">+ index</option></select></label>
    <label>zoom <select id="zoom">
      <option value="0.006">tight</option><option value="0.015" selected>normal</option>
      <option value="0.03">wide</option></select></label>
    <a href="flow_viewer.html">← flow viewer</a>
    <span id="info"></span>
  </div>
  <div id="legend">
    <span><i style="background:#3fb950"></i>net +γ (dealers long gamma)</span>
    <span><i style="background:#f85149"></i>net −γ</span>
    <span><i style="background:#58a6ff;height:2px"></i>call wall</span>
    <span><i style="background:#d29922;height:2px"></i>put wall</span>
    <span><i style="background:#e6edf3;height:2px"></i>peak |net γ|</span>
    <span><i style="background:#39c5cf;height:2px"></i>session high / low</span>
    <span><i style="background:#a371f7;height:2px"></i>open (dashed) / close</span>
    <span>levels derived per expiry · intensity = |net γ|</span>
  </div>
  <div id="wrap"><canvas id="cv"></canvas><div id="tip"></div><div id="empty"></div></div>
</div>
<script>
const $ = s => document.querySelector(s);
const TICKERS = ['SPY', 'QQQ', 'IWM'];
const qs = new URLSearchParams(location.search);
const WEEK = qs.get('week');
let doc = null, tk = qs.get('t') || localGet('wk_tk') || 'SPY', layout = null;

function localGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function localSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dlabel = iso => { const d = new Date(iso + 'T12:00:00'); return `${DOW[d.getDay()]} ${iso.slice(5)}`; };
const fmtG = v => { const a = Math.abs(v);
  return (v < 0 ? '−' : '') + (a >= 1e9 ? (a/1e9).toFixed(2)+'B' : a >= 1e6 ? (a/1e6).toFixed(1)+'M'
    : a >= 1e3 ? (a/1e3).toFixed(0)+'K' : a.toFixed(0)); };
const hhmm = mod => `${String(Math.floor(mod/60)).padStart(2,'0')}:${String(mod%60).padStart(2,'0')}`;

function drawTabs(){
  $('#tks').innerHTML = TICKERS.map(t =>
    `<button data-t="${t}" class="${t === tk ? 'on' : ''}">${t}</button>`).join(' ');
  for (const b of document.querySelectorAll('#tks button'))
    b.onclick = () => { tk = b.dataset.t; localSet('wk_tk', tk); drawTabs(); fillAsof(); draw(); };
}

/* Markers (walls, peak, session O/H/L/C): thick lines and bold labels on a
   dark backing, so they stay readable over bright heat. */
const MARK_LW = 2.5, MARK_FONT = 'bold 12px ui-monospace,monospace';
function markLabel(g, txt, x, yv, col){
  g.font = MARK_FONT;
  const tw = g.measureText(txt).width;
  g.fillStyle = '#0d1117d9'; g.fillRect(x - 3, yv - 17, tw + 6, 15);
  g.fillStyle = col; g.fillText(txt, x, yv - 5);
}

function T(){ return (doc && doc.tickers && doc.tickers[tk]) || {snapshots:{}, px:{}}; }

function fillAsof(){
  const sel = $('#asof'), keep = sel.value;
  const snaps = Object.keys(T().snapshots).sort();
  sel.innerHTML = `<option value="">latest</option>` +
    snaps.map(s => `<option value="${s}">as of ${dlabel(s)}</option>`).join('');
  if ([...sel.options].some(o => o.value === keep)) sel.value = keep;
}

/* For expiry E seen from view date V: the latest snapshot S <= min(E, V)
   that contains E. Past expiries land on their own morning; future ones on V. */
/* With "+ index" on, a snapshot that carries a blend for E draws the blend
   (ETF + index gamma on the ETF's strikes, walls re-derived on it); one that
   does not -- every snapshot before 2026-10-01, or a morning the index rows
   were missing -- falls back to the ETF heat and its header says so. */
const IDX = {SPY:'SPX', QQQ:'NDX', IWM:'RUT'};
function pick(E, V){
  const snaps = T().snapshots, lim = V && V < E ? V : E;
  let best = null;
  for (const s of Object.keys(snaps).sort())
    if (s <= lim && snaps[s].exp && snaps[s].exp[E]) best = s;
  if (!best) return null;
  const S = snaps[best], b = S.blend, bl = $('#gx').value && b && b.exp && b.exp[E];
  return {snap: best, taken: S.taken_et, spot: S.spot, src: S.src, ...(bl || S.exp[E]),
          blended: !!bl, wantBlend: !!$('#gx').value,
          bmeta: bl ? {idx: b.idx, ratio: b.ratio, src: b.ratio_src, taken: b.taken_et} : null};
}

function draw(){
  const cv = $('#cv'), wrap = $('#wrap'), dpr = window.devicePixelRatio || 1;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#0d1117'; g.fillRect(0, 0, W, H);
  const empty = $('#empty');
  if (!doc){ empty.style.display = 'flex';
    empty.textContent = 'no weekly snapshot yet — the bot writes live/weekly_gex/latest.json at the first GEX pass after 09:31 ET on a trading day.';
    return; }
  const days = doc.days || [], V = $('#asof').value || null, t = T();
  const cols = days.map(E => pick(E, V));
  const px = {};
  for (const d of days) if (!V || d <= V) px[d] = t.px[d] || [];
  if (!cols.some(Boolean) && !Object.values(px).some(a => a.length)){
    empty.style.display = 'flex'; empty.textContent = `no ${tk} data for the week of ${doc.week} yet.`; return; }
  empty.style.display = 'none';

  // ---- y range: the week's prices and snapshot spots, padded by the zoom
  const pts = [];
  for (const a of Object.values(px)) for (const [, v] of a) pts.push(v);
  for (const c of cols) if (c) pts.push(c.spot);
  for (const d of days){ const o = (t.ohlc || {})[d];     // true extremes, not 5m closes
    if (o && (!V || d < V)) pts.push(o.h, o.l); }
  const pad = parseFloat($('#zoom').value);
  const lo = Math.min(...pts) * (1 - pad), hi = Math.max(...pts) * (1 + pad);
  const AX = 64, TOP = 34, BOT = 8, pw = W - AX, ph = H - TOP - BOT;
  const y = p => TOP + (hi - p) / (hi - lo) * ph;
  const cw = pw / Math.max(days.length, 1);
  const x = (i, mod) => i * cw + (mod - 570) / 390 * cw;
  layout = {days, cols, cw, TOP, ph, lo, hi, AX, pw, y, V};

  // ---- heat
  const weekMax = Math.max(1, ...cols.filter(Boolean).flatMap(c => c.heat.map(h => Math.abs(h[1]))));
  const today = new Date().toLocaleDateString('en-CA', {timeZone: 'America/New_York'});
  cols.forEach((c, i) => {
    if (!c) return;
    const mx = $('#scale').value === 'week' ? weekMax : Math.max(1, ...c.heat.map(h => Math.abs(h[1])));
    const ks = c.heat.map(h => h[0]);
    const steps = ks.slice(1).map((k, j) => k - ks[j]).filter(s => s > 0).sort((a, b) => a - b);
    const step = steps.length ? steps[Math.floor(steps.length / 2)] : 1;
    const bh = Math.max(1, Math.abs(y(0) - y(step)) * 0.92);
    for (const [k, net] of c.heat){
      if (k < lo || k > hi) continue;
      const a = Math.min(1, Math.abs(net) / mx);
      if (a < 0.02) continue;
      g.fillStyle = net >= 0 ? `rgba(63,185,80,${(0.08 + 0.85*a).toFixed(3)})`
                             : `rgba(248,81,73,${(0.08 + 0.85*a).toFixed(3)})`;
      g.fillRect(i * cw + 1, y(k) - bh / 2, cw - 2, bh);
    }
    for (const [key, col, dash] of [['call_wall','#58a6ff',[8,5]], ['put_wall','#d29922',[8,5]], ['peak','#e6edf3',[3,4]]]){
      const k = c[key]; if (k == null || k < lo || k > hi) continue;
      g.strokeStyle = col; g.lineWidth = MARK_LW; g.setLineDash(dash);
      g.beginPath(); g.moveTo(i * cw + 2, y(k)); g.lineTo((i + 1) * cw - 2, y(k)); g.stroke();
      g.setLineDash([]);
      const nat = c.blended && c.labels && c.labels[key];
      // a wall with a near-equal rival is a ZONE (index_gex.WALL_TIE) -- say so
      const alt = c[key + '_alt'];
      const txt = `${k}${alt != null ? ' ≈ ' + alt : ''}`;
      markLabel(g, nat && cw >= 150 ? `${txt} · ${nat}` : txt, i * cw + 4, y(k), col);
      if (alt != null && alt >= lo && alt <= hi){
        g.strokeStyle = col; g.lineWidth = 1; g.setLineDash([2, 4]);
        g.beginPath(); g.moveTo(i * cw + 2, y(alt)); g.lineTo((i + 1) * cw - 2, y(alt)); g.stroke();
        g.setLineDash([]);
      }
    }
  });

  // ---- session OHLC in every ELAPSED day's column (before today, or before
  //      the "as of" day). RTH, from 1m bars -- true highs and lows.
  const cut = V || today;
  days.forEach((d, i) => {
    const o = (t.ohlc || {})[d];
    if (!o || d >= cut) return;
    for (const [key, col, dash, lw, lab] of [
        ['h', '#39c5cf', [], MARK_LW, 'H'], ['l', '#39c5cf', [], MARK_LW, 'L'],
        ['o', '#a371f7', [9, 5], MARK_LW, 'O'], ['c', '#a371f7', [], MARK_LW + 0.5, 'C']]){
      const v = o[key]; if (v == null || v < lo || v > hi) continue;
      g.strokeStyle = col; g.lineWidth = lw; g.setLineDash(dash);
      g.beginPath(); g.moveTo(i * cw + 2, y(v)); g.lineTo((i + 1) * cw - 2, y(v)); g.stroke();
      g.setLineDash([]);
      const txt = `${lab} ${v.toFixed(2)}`;
      g.font = MARK_FONT;
      markLabel(g, txt, (i + 1) * cw - g.measureText(txt).width - 8, y(v), col);
    }
  });

  // ---- grid: day separators, headers, price axis
  g.strokeStyle = '#30363d'; g.lineWidth = 1;
  days.forEach((d, i) => {
    g.beginPath(); g.moveTo(i * cw + .5, TOP - 30); g.lineTo(i * cw + .5, H - BOT); g.stroke();
    const n = days.filter(e => e >= today && e < d).length;
    const narrow = cw < 150;                     // phone: compact headers
    const tag = d < today ? (narrow ? 'exp' : 'expired') : `${d === today ? 0 : n}${narrow ? 'D' : 'DTE'}`;
    g.fillStyle = d === today ? '#a371f7' : '#8b949e'; g.font = '11px ui-monospace,monospace';
    g.fillText(narrow ? `${dlabel(d).slice(0, 3)} ${tag}` : `${dlabel(d)} · ${tag}`, i * cw + 4, 14);
    const c = cols[i]; g.fillStyle = '#6e7681'; g.font = '10px ui-monospace,monospace';
    const base = c ? (narrow ? `${c.snap.slice(5)} ${c.taken.slice(11, 16)}`
                             : `snap ${dlabel(c.snap)} ${c.taken.slice(11, 16)}`) : null;
    const bx = c && c.wantBlend
      ? (c.blended ? ` +${c.bmeta.idx}${c.share != null ? ' ' + Math.round(c.share * 100) + '%' : ''}`
                   : (narrow ? ' ETF' : ` no ${IDX[tk] || 'index'}`)) : '';
    g.fillText(c ? (base + bx).slice(0, narrow ? Math.floor(cw / 6.2) : 999)
                 : (narrow ? '—' : 'no snapshot'), i * cw + 4, 27);
    if (c && c.wantBlend){                       // cyan header rule = blended column
      g.fillStyle = c.blended ? '#39c5cf' : '#6e7681'; g.fillRect(i * cw + 1, 31, cw - 2, 2); }
  });
  if (days.includes(today) && !V){
    const i = days.indexOf(today); g.strokeStyle = '#a371f7'; g.lineWidth = 1.5;
    g.strokeRect(i * cw + 1, TOP - 30, cw - 2, H - BOT - TOP + 30);
  }
  g.fillStyle = '#8b949e'; g.font = '11px ui-monospace,monospace';
  // round price steps (0.25 / 0.5 / 1 / 2 / 5 ...), about one per 60px
  const raw = (hi - lo) / Math.max(4, Math.floor(ph / 60));
  const st = [0.1, 0.25, 0.5, 1, 2, 2.5, 5, 10, 20, 25, 50].find(s => s >= raw) || 100;
  for (let p = Math.ceil(lo / st) * st; p <= hi; p += st){
    g.fillText(p.toFixed(st < 1 ? 2 : 0), pw + 6, y(p) + 4);
    g.strokeStyle = '#1c2128'; g.beginPath(); g.moveTo(0, y(p)); g.lineTo(pw, y(p)); g.stroke();
  }

  // ---- price line
  g.strokeStyle = '#e6edf3'; g.lineWidth = 1.6; g.beginPath();
  let started = false;
  days.forEach((d, i) => {
    for (const [mod, v] of (px[d] || [])){
      const X = x(i, mod), Y = y(v);
      if (!started){ g.moveTo(X, Y); started = true; } else g.lineTo(X, Y);
    }
  });
  g.stroke();
  const lastDay = [...days].reverse().find(d => (px[d] || []).length);
  if (lastDay){
    const a = px[lastDay], [mod, v] = a[a.length - 1], i = days.indexOf(lastDay);
    g.fillStyle = '#a371f7'; g.beginPath(); g.arc(x(i, mod), y(v), 3.5, 0, 7); g.fill();
    g.fillRect(pw, y(v) - 8, AX, 16); g.fillStyle = '#0d1117'; g.fillText(v.toFixed(2), pw + 6, y(v) + 4);
  }
}

$('#wrap').addEventListener('mousemove', ev => {
  const tip = $('#tip'); if (!layout){ tip.style.display = 'none'; return; }
  const r = ev.currentTarget.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const {days, cols, cw, TOP, ph, lo, hi, pw} = layout;
  const i = Math.floor(mx / cw);
  if (mx > pw || i < 0 || i >= days.length || my < TOP){ tip.style.display = 'none'; return; }
  const p = hi - (my - TOP) / ph * (hi - lo);
  const c = cols[i], mod = 570 + Math.round((mx - i * cw) / cw * 390);
  const pxs = (T().px[days[i]] || []).filter(([m]) => m <= mod), last = pxs[pxs.length - 1];
  let s = `${dlabel(days[i])} expiry\nprice ${p.toFixed(2)}`;
  if (last) s += `   ${hhmm(last[0])} close ${last[1].toFixed(2)}`;
  const o = (T().ohlc || {})[days[i]];
  const today = new Date().toLocaleDateString('en-CA', {timeZone: 'America/New_York'});
  if (o && days[i] < (layout.V || today))
    s += `\nsession O ${o.o.toFixed(2)}  H ${o.h.toFixed(2)}  L ${o.l.toFixed(2)}  C ${o.c.toFixed(2)}` +
         (o.final ? '' : '  (not final)');
  if (c){
    const h = c.heat.reduce((b, h) => Math.abs(h[0] - p) < Math.abs(b[0] - p) ? h : b, c.heat[0]);
    s += `\nstrike ${h[0]}  net ${fmtG(h[1])}\n  call ${fmtG(h[2])}  put ${fmtG(h[3])}` +
         `\nsnapshot ${dlabel(c.snap)} ${c.taken.slice(11, 16)} ET, spot ${c.spot}` +
         `\nwalls: call ${c.call_wall}${c.call_wall_alt != null ? '≈' + c.call_wall_alt : ''}` +
         `  put ${c.put_wall}${c.put_wall_alt != null ? '≈' + c.put_wall_alt : ''}` +
         `  peak ${c.peak}${c.peak_alt != null ? '≈' + c.peak_alt : ''}` +
         (c.call_wall_alt != null || c.put_wall_alt != null || c.peak_alt != null
           ? '\n  ≈ = a strike >1 step away holds ≥85% of the wall\'s gamma: a zone, not one strike' : '') +
         (c.src ? `\ndata: ${c.src === 'webull' ? 'Webull' : 'Unusual Whales'}` : '');
    if (c.blended){
      const L = c.labels || {};
      s += `\n+${c.bmeta.idx}: ${c.share != null ? Math.round(c.share * 100) + '% of the band\'s gamma' : ''}` +
           `  ratio ${c.bmeta.ratio} (${c.bmeta.src === 'today' ? 'that session' : 'from ' + c.bmeta.src})` +
           (Object.keys(L).length ? `\n  ${Object.entries(L).map(([k, v]) => `${k.replace('_', ' ')} = ${v}`).join('  ')}` : '');
    } else if (c.wantBlend) s += `\n(no ${IDX[tk] || 'index'} blend in this snapshot — ETF only)`;
  } else s += '\nno snapshot for this expiry';
  tip.textContent = s; tip.style.display = 'block';
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(mx + 14, r.width - tw - 4) + 'px';
  tip.style.top = Math.min(my + 14, r.height - th - 4) + 'px';
});
$('#wrap').addEventListener('mouseleave', () => $('#tip').style.display = 'none');
for (const id of ['#asof', '#scale', '#zoom']) $(id).addEventListener('change', draw);
$('#gx').value = localGet('wk_gx') || '';
$('#gx').addEventListener('change', () => { localSet('wk_gx', $('#gx').value); draw(); });
window.addEventListener('resize', draw);

async function load(){
  const path = WEEK ? `live/weekly_gex/${WEEK}.json` : 'live/weekly_gex/latest.json';
  try {
    const r = await fetch(path + '?t=' + Date.now());
    if (r.ok){ doc = await r.json();
      $('#info').textContent = `week of ${doc.week}` + (doc.updated
        ? ` · updated ${new Date(doc.updated * 1000).toLocaleTimeString('en-US', {timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit'})} ET` : '');
    } else { doc = null; $('#info').textContent = `${path}: ${r.status}`; }
  } catch(e){ doc = null; $('#info').textContent = 'fetch failed'; }
  fillAsof(); draw();
}
drawTabs(); load();
if (!WEEK) setInterval(load, 60000);
</script>
</body>
</html>
